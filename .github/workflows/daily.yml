name: Daily Newspaper

on:
  schedule:
    - cron: '0 1 * * *'  # 7:00 PM CST
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Sync existing site
        run: |
          git clone --branch gh-pages --depth 1 https://github.com/${{ github.repository }}.git existing_site
          if [ -f "existing_site/nyt_morning.html" ]; then cp existing_site/nyt_morning.html ./; fi
          if [ -d "existing_site/old_issues" ]; then cp -r existing_site/old_issues ./; fi
          rm -rf existing_site
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run Newspaper Build
        env:
          INSTAPAPER_USER: ${{ secrets.INSTAPAPER_USER }}
          INSTAPAPER_PASS: ${{ secrets.INSTAPAPER_PASS }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python main.py
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true