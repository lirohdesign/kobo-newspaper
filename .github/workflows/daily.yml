name: Kobo Daily Sync

on:
  schedule:
    - cron: '0 11 * * *' # 5:00 AM CST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v3

      # This step pulls your existing archive so the Python script can update it
      - name: Checkout Existing Gh-Pages (for Archive)
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: existing_site
          
      - name: Sync Archive Folders
        run: |
          if [ -d "existing_site/old_issues" ]; then
            cp -r existing_site/old_issues ./
            echo "DIAGNOSTIC: Previous issues synced."
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Newspaper Build
        env:
          INSTAPAPER_USER: ${{ secrets.INSTAPAPER_USER }}
          INSTAPAPER_PASS: ${{ secrets.INSTAPAPER_PASS }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages