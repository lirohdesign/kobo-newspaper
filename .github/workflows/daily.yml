name: Daily Newspaper

on:
  schedule:
    # 6:30 AM CST (12:30 PM UTC) Weekdays (Mon-Fri)
    - cron: '29 12 * * 1-5'
    # 7:45 AM CST (1:45 PM UTC) Weekends (Sat-Sun)
    - cron: '43 13 * * 6,0'
    # Backup runs 4h later. GitHub can skip a scheduled run or fail to get it
    # a runner (2026-10-05: no issue that day). main.py sends only from the
    # first build of the day, so when the main run worked this one just
    # refreshes the site.
    - cron: '29 16 * * 1-5'
    - cron: '43 17 * * 6,0'
  workflow_dispatch:

# Queue overlapping runs so the second sees the first's old_issues/ file and
# skips the send, rather than both sending.
concurrency:
  group: daily-newspaper
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      
      - name: Sync existing site
        run: |
          git clone --branch gh-pages --depth 1 https://github.com/${{ github.repository }}.git existing_site
          if [ -f "existing_site/nyt_morning.html" ]; then cp existing_site/nyt_morning.html ./; fi
          if [ -d "existing_site/old_issues" ]; then cp -r existing_site/old_issues ./; fi
          rm -rf existing_site
          
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: pip install requests beautifulsoup4 certifi pillow
        
      - name: Run Newspaper Build
        env:
          INSTAPAPER_USER: ${{ secrets.INSTAPAPER_USER }}
          INSTAPAPER_PASS: ${{ secrets.INSTAPAPER_PASS }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NWS_CWA: ${{ secrets.NWS_CWA }}
        run: python main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true