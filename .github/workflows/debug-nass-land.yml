name: Debug NASS Land Values (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python3 -c "
          import os, json, urllib.request, urllib.parse
          key = os.environ['NASS_API_KEY']
          params = {
              'key': key,
              'source_desc': 'SURVEY',
              'sector_desc': 'ECONOMICS',
              'commodity_desc': 'RENT',
              'state_alpha': 'IN',
              'year': 2025,
              'format': 'JSON',
          }
          url = 'https://quickstats.nass.usda.gov/api/api_GET/?' + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.loads(r.read()).get('data', [])
              print('rows:', len(data))
              seen = set()
              for row in data:
                  key_tuple = (row.get('statisticcat_desc'), row.get('unit_desc'), row.get('class_desc'), row.get('agg_level_desc'))
                  if key_tuple not in seen:
                      seen.add(key_tuple)
                      print(key_tuple, '->', row.get('Value'), row.get('year'))
          except urllib.error.HTTPError as e:
              print('HTTP error:', e.code, e.read())
          "
