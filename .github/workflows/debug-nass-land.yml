name: Debug NASS Land Values (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python3 -c "from nass_land_values_scrape import collect; print(collect())"
