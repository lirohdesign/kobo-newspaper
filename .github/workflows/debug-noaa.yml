name: Debug NOAA GSOM (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - env:
          NOAA_TOKEN: ${{ secrets.NOAA_TOKEN }}
        run: python3 -c "from noaa_ncei_scrape import fetch_items; [print(i['title'], '\n ', i['summary']) for i in fetch_items()]"
