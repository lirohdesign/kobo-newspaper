name: Debug NOAA GSOM (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - env:
          NOAA_TOKEN: ${{ secrets.NOAA_TOKEN }}
        run: |
          python3 -c "
          import os, json, urllib.request, urllib.parse
          from datetime import datetime, timedelta, timezone
          token = os.environ['NOAA_TOKEN']
          end = datetime.now(timezone.utc).date()
          start = end - timedelta(days=150)
          params = {
              'datasetid': 'GSOM',
              'locationid': 'FIPS:18',
              'startdate': start.isoformat(),
              'enddate': end.isoformat(),
              'units': 'standard',
              'limit': 1000,
          }
          url = 'https://www.ncdc.noaa.gov/cdo-web/api/v2/data?' + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={'token': token, 'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.loads(r.read()).get('results', [])
          print('rows:', len(data))
          types = {}
          for row in data:
              types.setdefault(row['datatype'], []).append(row['value'])
          for dt, vals in types.items():
              print(dt, '-> count', len(vals), 'sample', vals[:3])
          "
