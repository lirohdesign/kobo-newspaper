name: NASS Debug
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install certifi
      - env: {NASS_API_KEY: "${{ secrets.NASS_API_KEY }}"}
        run: |
          python - <<'PY'
          import os,nass_crop_progress_scrape as n
          from collections import Counter
          for c in ["CORN","SOYBEANS"]:
              rows=n._query(os.environ["NASS_API_KEY"],c,2026)
              print(c,sorted(Counter((r.get("week_ending"),r.get("load_time","")[:16]) for r in rows).items())[-4:])
          PY
