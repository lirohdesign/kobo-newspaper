name: NOAA Debug
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install certifi
      - env: {NOAA_TOKEN: "${{ secrets.NOAA_TOKEN }}"}
        run: |
          python noaa_ncei_scrape.py
