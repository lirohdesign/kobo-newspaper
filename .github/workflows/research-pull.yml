name: Research Pull

on:
  schedule:
    # 4:30 PM CT (21:30 UTC) daily — after NASS Crop Progress posts Monday
    # 4 PM ET, so Monday's run carries the new week into the Tuesday-morning
    # research-digest session. GitHub starts scheduled runs 3-5h late in
    # practice (observed Sept 2026); that still lands Monday evening.
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull_and_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research pull
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          NOAA_TOKEN: ${{ secrets.NOAA_TOKEN }}
        run: python research_pull.py

      - name: Commit updated research_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research_data/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Automated research data pull"
          git push
